pulse.rules = [
    {
        matches = [
            {
                # Matches your exact application name parameter string
                application.name = "Journey.exe"
            },
            {
                # Matches SOMA's standard executable block wrapper
                application.name = "Soma.exe"
            }
        ]
        actions = {
            update-props = {
                # Routes matching items natively to your loopback track
                target.object = "input.Game-Track"
            }
        }
    }
]
