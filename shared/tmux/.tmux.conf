# Custom tmux.conf

# set -g terminal-overrides ',xterm-256color:Tc'
# set -as terminal-overrides ',xterm*:sitm=\E[3m'
#
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# For Yazi
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Key bindings

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# Window splitting

unbind %
bind | split-window -h -c "#{pane_current_path}" 

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# Reload tmux config

unbind r
bind r source-file ~/.tmux.conf

# Window resizing

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -r m resize-pane -Z

set -g mouse on

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse

# source config with C-a + r
bind-key r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 10

# List of plugins
# set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes
set -g @plugin 'soyuka/tmux-current-pane-hostname'
set -g @plugin 'jonmosco/kube-tmux'

# theme

# set -g @plugin 'seebi/tmux-colors-solarized'
set -g @plugin "janoamaral/tokyo-night-tmux"
# set -g @plugin 'fabioluciano/tmux-tokyo-night'

set -g @tokyo-night-tmux_window_id_style none

# start counting windows and panels from 1
set -g base-index 1
set-window-option -g pane-base-index 1

# Status bar
# set -goq status-position bottom
# set -goq status-right "#(/bin/bash $HOME/.tmux/plugins/kube-tmux/kube.tmux red cyan) | #{hostname_short} | %a %b %e %H:%M  "
# set -goq status-right-length 80
# set -goq status-left " #U | "
# set -goq status-left-length 50
# set -goq status-interval 1


# Initialize TMUX plugin manager (keep this line at the bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

 set-option -g status-right "#(/bin/bash $HOME/.tmux/plugins/kube-tmux/kube.tmux red cyan) | %a %b %e %H:%M  "
