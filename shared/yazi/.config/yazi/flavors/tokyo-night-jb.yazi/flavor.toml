title_error = { fg = "#e0af68" }
icon_info = ""
icon_warn = ""
icon_error = ""

[filetype]

rules = [
  # Images
  { mime = "image/*", fg = "#e0af68" },

  # Media
  { mime = "video/*", fg = "#d699b6" },
  { mime = "audio/*", fg = "#d699b6" },

  # Archives
  { mime = "application/zip", fg = "#bb9af7" },
  { mime = "application/x-tar", fg = "#bb9af7" },
  { mime = "application/x-bzip*", fg = "#bb9af7" },
  { mime = "application/x-bzip2", fg = "#bb9af7" },
  { mime = "application/x-7z-compressed", fg = "#bb9af7" },
  { mime = "application/x-rar", fg = "#bb9af7" },
  { mime = "application/x-xz", fg = "#bb9af7" },

  # Documents
  { mime = "application/doc", fg = "#9ece6a" },
  { mime = "application/epub+zip", fg = "#9ece6a" },
  { mime = "application/pdf", fg = "#9ece6a" },
  { mime = "application/rtf", fg = "#9ece6a" },
  { mime = "application/vnd.*", fg = "#9ece6a" },

  # Orphan symbolic links
  { name = "*", is = "orphan", bg = "#FF838B", fg = "#080A0E", crossed = true },

  # Fallback
  { name = "*", fg = "#c6d0f5" },
  { name = "*/", fg = "#7aa2f7" },

]

[icon]
prepend_dirs = [
  { name = "Desktop", text = "", fg = "#FC9F5B" },
  { name = "Documents", text = "󰂺", fg = "#FBD1A2" },
  { name = "Downloads", text = "󰅢", fg = "#20A4F3" },
  { name = "Games", text = "󰊖", fg = "#7DCFB6" },
  { name = "Music", text = "", fg = "#33CA7F" },
  { name = "Pictures", text = "", fg = "#C1666B" },
  { name = "Public", text = "", fg = "#D4B483" },
  { name = "Shares", text = "󰡰", fg = "#E4DFDA" },
  { name = "Videos", text = "", fg = "#48A9A6" },
  { name = "code", text = "", fg = "#731DD8" },
]

append_exts = [{ name = "mp3", text = "", fg = "#00afff" }]
