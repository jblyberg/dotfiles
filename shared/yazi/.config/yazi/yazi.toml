[mgr]

linemode = "size_and_mtime"
ratio = [1, 3, 4]
scrolloff = 5
show_hidden = false
show_symlink = true
sort_by = "alphabetical"
sort_dir_first = true
sort_reverse = false
sort_sensitive = true

[open]

prepend_rules = [
  { url = "*.exe", use = "umu-run" },

  { url = "*.pdf", use = [
    "zathura",
  ] },
  { mime = "application/pdf", use = [
    "zathura",
  ] },

  { mime = "audio/*", use = [
    "audacious",
  ] },
  { url = "*.m4b", use = [
    "audacious",
  ] },

  { mime = "image/*", use = [
    "loupe",
    "preview",
  ] },

  { mime = "video/*", use = [
    "celluloid",
  ] },

  { mime = "application/vnd.openxmlformats-officedocument.*", use = [
    "libreoffice",
  ] },
  { mime = "application/msword", use = [
    "libreoffice",
  ] },
  { mime = "application/vnd.ms-excel", use = [
    "libreoffice",
  ] },
]

[opener]

# Linux Openers

audacious = [
  { run = 'audacious -p %s', orphan = true, for = "linux", desc = "Play audio with Audacious" },
]

celluloid = [
  { run = 'celluloid %s', orphan = true, for = "linux", desc = "Play video with Celluloid" },
]

libreoffice = [
  { run = 'SAL_USE_VCLPLUGIN=gtk3 libreoffice %s', orphan = true, for = "linux", desc = "Open with LibreOffice" },
]

loupe = [
  { run = 'loupe %s', orphan = true, for = "linux", desc = "Open image with Loupe" },
]

umu-run = [
  { run = 'umu-run "$@" -opengl -SkipBuildPatchPrereq', for = "linux", desc = "Open Windows Application" },
]

zathura = [
  { run = 'zathura %s', orphan = true, for = "linux", desc = "Open PDF with Zathura" },
]

# MacOS Openers

preview = [
  { run = 'open -a Preview "$@"', orphan = true, for = "macos", desc = "Open image with Preview" },
]

# Shared Openers

office = [
  { run = 'open %s', orphan = true, for = "macos", desc = "Open with Default App" },
  { run = 'SAL_USE_VCLPLUGIN=gtk3 libreoffice %s', orphan = true, for = "linux", desc = "Open with LibreOffice" },
]

[preview]

cache_dir = "~/.local/cache/yazi"
max_height = 1500
max_width = 1500
wrap = "yes"

[plugin]

prepend_preloaders = [

  # 3D Objects (grouped together into a single glob)
  { url = "*.{3mf,obj,pts,ply,stl,step,stp,skp}", run = "f3d-preview" },

  # Audio
  { mime = "audio/*", run = "audio-preview" },
]

prepend_previewers = [

  { url = "*/", run = "folder", sync = true },

  # Misc previewers
  { mime = "application/bittorrent", run = "torrent-preview" },

  # Office Documents
  # --- WORD DOCUMENTS (.docx / .doc) ---
  { mime = "application/vnd.openxmlformats-officedocument.wordprocessingml.document", run = 'piper -- pandoc -t markdown "$1"' },
  { mime = "application/msword", run = 'piper -- pandoc -t markdown "$1"' },

  # --- EXCEL SPREADSHEETS (.xlsx / .xls) ---
  { mime = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet", run = 'piper -- xlsx2csv "$1"' },
  { mime = "application/vnd.ms-excel", run = 'piper -- xlsx2csv "$1"' },
  
  # --- FALLBACK PATH GLOB MATCHING ---
  { url = "*.docx", run = 'piper -- pandoc -t markdown "$1"' },
  { url = "*.xlsx", run = 'piper -- xlsx2csv "$1"' },

  # 3d objects
  { url = "*.{3mf,obj,pts,ply,stl,step,stp,skp}", run = "f3d-preview" },

  # Fonts
  { url = "*.ttf", run = "font-sample" },
  { url = "*.otf", run = "font-sample" },
]
