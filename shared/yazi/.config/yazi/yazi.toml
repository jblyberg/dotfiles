[mgr]

linemode = "size_and_mtime"
ratio = [1, 3, 4]
scrolloff = 5
show_hidden = false
show_symlink = true
sort_by = "alphabetical"
sort_dir_first = true
sort_reverse = false
sort_sensitive = true


[open]

prepend_rules = [
  { url = "*.exe", use = "exe" },
  { url = "*.pdf", use = ["pdf", "reveal"] },
  { mime = "application/pdf", use = ["pdf", "reveal"] },
  # { mime = "audio/*", use = "audio" },
  { mime = "audio/*", use = "audio" },
  { mime = "image/*", use = "image" },
  { mime = "video/*", use = "video" },
]

[opener]
audio = [
  { run = 'mpv --ontop --player-operation-mode=pseudo-gui "$@" & sleep 0.5 && osascript -e "tell application \"System Events\" to set frontmost of process \"mpv\" to true"', orphan = true, for = "macos", desc = "Interactive Preview" },
  { run = 'mpv --player-operation-mode=pseudo-gui "$@"', orphan = true, for = "linux", desc = "mpv Preview" },
]

exe = [
  { run = 'umu-run "$@" -opengl -SkipBuildPatchPrereq', desc = "Open Windows Application" },
]

image = [
  { run = 'loupe "$@"', desc = "Open Image", for = "linux" },
  { run = 'open -a Preview "$@"', desc = "Open Image", for = "macos" },
]

pdf = [
  { run = 'zathura "$@"', desc = "Open PDF", block = true, for = "linux" },
  { run = 'open -a Preview "$@"', desc = "Open PDF", for = "macos" },
]

video = [
  { run = 'mpv --ontop --player-operation-mode=pseudo-gui "$@" & sleep 0.5 && osascript -e "tell application \"System Events\" to set frontmost of process \"mpv\" to true"', orphan = true, for = "macos", desc = "Video Preview" },
  { run = 'mpv --ontop --player-operation-mode=pseudo-gui "$@"', orphan = true, for = "linux", desc = "Video Preview" },
]

wallpaper = [
  { run = 'dms ipc call wallpaper set "$1"', desc = "Set as Wallpaper", for = "linux" },
]

[preview]

cache_dir = "~/.local/cache/yazi"
max_height = 1500
max_width = 1500
wrap = "yes"

[plugin]

prepend_fetchers = [
  { group = "git", url = "*", run = "git" },
  { group = "git", url = "*/", run = "git" },
  { group = "pdf", url = "*.pdf", run = "pdf", prio = "low" },
]

prepend_preloaders = [
  # Office Documents (grouped together)
  { mime = "{application/ms-*,application/msword,application/oasis.opendocument.*,application/openxmlformats-officedocument.*}", run = "office" },
  { url = "*.docx", run = "office" },

  # 3D Objects (grouped together into a single glob)
  { url = "*.{3mf,obj,pts,ply,stl,step,stp,skp}", run = "f3d-preview" },

  # Audio
  { mime = "audio/*", run = "audio-preview" },
]

prepend_previewers = [

  { url = "*/", run = "folder", sync = true },

  # Misc previewers
  { mime = "application/bittorrent", run = "torrent-preview" },
  { mime = "audio/*", run = "exifaudio" },

  # Office Documents
  { mime = "application/ms-*", run = "office" },
  { mime = "application/msword", run = "office" },
  { mime = "application/oasis.opendocument.*", run = "office" },
  { mime = "application/openxmlformats-officedocument.*", run = "office" },
  { mime = "video/*", run = "video-ffmpeg" },
  { url = "*.docx", run = "office" },

  # 3d objects
  { url = "*.3mf", run = "f3d-preview" },
  { url = "*.obj", run = "f3d-preview" },
  { url = "*.ply", run = "f3d-preview" },
  { url = "*.pts", run = "f3d-preview" },
  { url = "*.skp", run = "f3d-preview" },
  { url = "*.step", run = "f3d-preview" },
  { url = "*.stl", run = "f3d-preview" },
  { url = "*.stp", run = "f3d-preview" },

]
