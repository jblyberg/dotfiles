[mgr]

ratio = [1, 3, 4]
sort_sensitive = true
sort_dir_first = true
linemode = "size_and_mtime"
# Define the columns to display and their order
# columns = ["name", "size", "mtime", "permissions"]

[opener]

# open_exe = [{ run = 'wine "$@"', desc = "Open Windows Application" }]
open_exe = [
  { run = 'umu-run "$@" -opengl -SkipBuildPatchPrereq', desc = "Open Windows Application" },
]
open_pdf = [{ run = 'evince "$@"', desc = "Open PDF" }]

[open]
prepend_rules = [
  { name = "*.exe", use = "open_exe" },
  { name = "*.pdf", use = "open_pdf" },
]

[plugin]

prepend_preloaders = [
  # Office Documents
  { mime = "application/openxmlformats-officedocument.*", run = "office" },
  { mime = "application/oasis.opendocument.*", run = "office" },
  { mime = "application/ms-*", run = "office" },
  { mime = "application/msword", run = "office" },
  { name = "*.docx", run = "office" },
]

prepend_previewers = [
  # Office Documents
  { mime = "application/openxmlformats-officedocument.*", run = "office" },
  { mime = "application/oasis.opendocument.*", run = "office" },
  { mime = "application/ms-*", run = "office" },
  { mime = "application/msword", run = "office" },
  { name = "*.docx", run = "office" },
]
